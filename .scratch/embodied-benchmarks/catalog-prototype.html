<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>具身智能专区 · 首页原型</title><link rel="stylesheet" href="../../src/styles/main.css"><style>
/* 临时原型：比较三种专区分类布局，沿用项目主题色和既有卡片样式。 */
body { padding-bottom: 110px; } .shell { border-bottom:1px solid var(--border); background:var(--surface); }
.shell .container { max-width:1180px; min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
.brand {font-size:17px;font-weight:700;color:var(--text-strong)} .nav {display:flex;gap:24px;color:var(--text-secondary);font-size:13px} .nav strong {color:var(--accent-text)}
main.container { max-width:1180px; padding-top:28px; } .notice {padding:10px 14px;background:var(--accent-softer);border-left:3px solid var(--accent-border-strong);color:var(--text-secondary);font-size:12px}
.heading {padding:28px 0 22px;} h1 {font-size:30px;letter-spacing:-.03em;color:var(--text-strong)} .lead {max-width:760px;color:var(--text-secondary);margin-top:10px;line-height:1.8}
.search-row {display:flex;gap:12px;margin-bottom:20px}.search-row input {width:100%;min-height:44px;border:1px solid var(--border);border-radius:6px;padding:0 14px;background:var(--surface)}
.aside-layout {display:grid;grid-template-columns:210px minmax(0,1fr);gap:28px}.filter-label {color:var(--muted);font-size:12px;font-weight:600;margin-bottom:10px}.filter-list {display:flex;flex-direction:column;gap:4px}.filter-list button,.filter-strip button {text-align:left;padding:9px 12px;border-radius:6px;color:var(--text-secondary)} .filter-list button[aria-pressed=true],.filter-strip button[aria-pressed=true] {background:var(--accent-softer);color:var(--accent-text);font-weight:600}
.filter-strip {display:flex;gap:6px;flex-wrap:wrap;margin:0 0 22px;padding-bottom:14px;border-bottom:1px solid var(--border)}.filter-strip button {border:1px solid var(--border);background:var(--surface)}
.section-heading {display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:0 0 15px}.section-heading h2 {font-size:19px}.muted-note {font-size:12px;color:var(--muted)}
.items {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.item {border:1px solid var(--border);border-radius:9px;background:var(--surface);padding:20px;min-width:0}.item h3 {font-size:16px;color:var(--text-strong)}.item p {margin:8px 0 14px;color:var(--text-secondary);line-height:1.75;font-size:13px}.meta {display:flex;flex-wrap:wrap;gap:7px}.meta span {font-size:11px;color:var(--muted);border:1px solid var(--border);padding:2px 7px;border-radius:4px}.item a {display:inline-flex;margin-top:16px;color:var(--accent-text);font-size:12px}
.resource-note {margin-top:28px;padding-top:20px;border-top:1px solid var(--border);color:var(--text-secondary);font-size:13px}.resource-note strong {color:var(--text-strong)}.groups section {margin-bottom:28px}.groups .items {grid-template-columns:repeat(2,minmax(0,1fr))}.empty {padding:18px;color:var(--muted);border:1px dashed var(--border);border-radius:8px}
.dock {position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:12px;padding:8px;background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;box-shadow:0 6px 24px var(--dock-shadow);white-space:nowrap}.dock button {min-width:42px;min-height:42px;border-radius:6px;background:var(--accent-softer);color:var(--accent-text)}.dock strong {min-width:130px;text-align:center;font-size:13px}
[hidden] {display:none!important}@media(max-width:700px){.shell .container {padding-top:12px;padding-bottom:12px;flex-wrap:wrap}.nav{gap:14px}.aside-layout{grid-template-columns:1fr;gap:16px}.filter-list{flex-direction:row;flex-wrap:wrap}.filter-list button{border:1px solid var(--border)}.items,.groups .items{grid-template-columns:1fr}.item{padding:18px}.heading{padding:22px 0}h1{font-size:27px}}
</style></head><body><header class="shell"><div class="container"><div class="brand">what’s a benchmark?</div><nav class="nav" aria-label="示意导航"><span>评测目录</span><strong>具身智能</strong><span>阅读指南</span></nav></div></header><main class="container"><p class="notice"><strong>临时布局原型</strong> · 评测名称来自公开项目；仅供讨论，尚未加入正式目录。</p><header class="heading"><h1>具身智能评测</h1><p class="lead">从机器人抓取、导航到多步骤操作，了解评测任务、数据和评分方式。</p></header><div class="search-row"><input id="search" type="search" placeholder="搜索评测名称或任务" aria-label="搜索评测名称或任务"></div><div id="view"></div><p class="resource-note"><strong>相关资源</strong>　数据集、模拟器和比赛作为相关资料单独标注，不混同为评测。</p></main><div class="dock" role="group" aria-label="原型切换"><button id="previous" type="button" aria-label="上一个方案">←</button><strong id="variant-label" aria-live="polite"></strong><button id="next" type="button" aria-label="下一个方案">→</button></div><script>
// 样例分类仅用于比较页面结构，具体归类仍需核对和讨论。
const entries=[
{name:'LIBERO',group:'抓取与操作',description:'根据语言指令操作物体，并考查任务之间的知识迁移。',tags:['仿真','机械臂'],url:'https://libero-project.github.io/'},
{name:'RLBench',group:'抓取与操作',description:'视觉引导下完成多种机器人操作任务。',tags:['仿真','机械臂'],url:'https://github.com/stepjam/RLBench'},
{name:'GraspNet-1Billion',group:'抓取与操作',description:'从真实场景图像预测物体的抓取姿态。',tags:['真实场景数据','抓取'],url:'https://graspnet.net/'},
{name:'Room-to-Room (R2R)',group:'导航与移动',description:'根据自然语言路线指令，在建筑环境中导航。',tags:['模拟环境','语言导航'],url:'https://arxiv.org/abs/1711.07280'},
{name:'RoboTwin 2.0',group:'双臂协作',description:'双臂机器人完成抓取、交接及放置等操作。',tags:['仿真','双臂'],url:'https://robotwin-platform.github.io/'},
{name:'BEHAVIOR-1K',group:'长步骤任务',description:'在家庭环境中完成涉及移动和操作的日常活动。',tags:['仿真','家庭任务'],url:'https://behavior.stanford.edu/'},
{name:'CALVIN',group:'长步骤任务',description:'根据语言指令连续完成多个机械臂操作步骤。',tags:['仿真','机械臂'],url:'https://arxiv.org/abs/2112.03227'}
];
const groups=['全部','抓取与操作','导航与移动','双臂协作','长步骤任务'];const variants=[{id:'A',label:'A · 侧边分类'},{id:'B',label:'B · 顶部分类'},{id:'C',label:'C · 分组浏览'}];
let active='全部',query='';let index=Math.max(0,variants.findIndex(v=>v.id===new URLSearchParams(location.search).get('variant')));
const safe=x=>x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function card(x){return `<article class="item"><h3>${safe(x.name)}</h3><p>${safe(x.description)}</p><div class="meta">${x.tags.map(t=>`<span>${safe(t)}</span>`).join('')}</div><a href="${x.url}" target="_blank" rel="noreferrer">官方资料 ↗</a></article>`}
function filters(cls){return `<div class="${cls}" aria-label="任务筛选">${groups.map(g=>`<button type="button" data-group="${g}" aria-pressed="${active===g}">${g}</button>`).join('')}</div>`}
function render(){const chosen=entries.filter(x=>(active==='全部'||x.group===active)&&(`${x.name} ${x.description} ${x.group}`).toLowerCase().includes(query));const content=chosen.length?chosen.map(card).join(''):'<p class="empty">没有符合条件的示例。</p>';const heading=`<div class="section-heading"><h2>评测示例</h2><span class="muted-note">以下为原型示例，不代表已收录</span></div>`;let html='';if(index===0){html=`<div class="aside-layout"><aside><div class="filter-label">任务类型</div>${filters('filter-list')}</aside><div>${heading}<div class="items">${content}</div></div></div>`}else if(index===1){html=`${filters('filter-strip')}${heading}<div class="items">${content}</div>`}else{html=`${filters('filter-strip')}<div class="groups">${groups.slice(1).map(g=>{let items=chosen.filter(x=>x.group===g);return items.length?`<section><div class="section-heading"><h2>${g}</h2></div><div class="items">${items.map(card).join('')}</div></section>`:''}).join('')||'<p class="empty">没有符合条件的示例。</p>'}</div>`}document.querySelector('#view').innerHTML=html;document.querySelector('#variant-label').textContent=variants[index].label;const url=new URL(location.href);url.searchParams.set('variant',variants[index].id);history.replaceState(null,'',url);}
document.querySelector('#view').addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(b){active=b.dataset.group;render()}});document.querySelector('#search').addEventListener('input',e=>{query=e.target.value.toLowerCase().trim();render()});function cycle(d){index=(index+d+variants.length)%variants.length;render()}document.querySelector('#previous').addEventListener('click',()=>cycle(-1));document.querySelector('#next').addEventListener('click',()=>cycle(1));document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable=true]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
</script></body></html>
