  <title id="hero-title">what's a benchmark? — AI benchmark reference</title>
  <desc id="hero-desc">A Chinese-language reference for AI benchmark tasks and scores. The original HumanEval/0 example uses [1.0, 2.0, 3.0] and threshold 0.5, with expected result False. This is a task excerpt, not a model run or score.</desc>
