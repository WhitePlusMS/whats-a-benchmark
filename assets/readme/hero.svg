<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="420" viewBox="0 0 1200 420"
     role="img" aria-labelledby="hero-title hero-desc"
     font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <title id="hero-title">what's a benchmark? · 到底测什么？</title>
  <desc id="hero-desc">中文 AI 评测资料站。沿用项目的紫色书本标识，以 HumanEval/0 的真实题目节选说明任务、样例与 pass@k 评分方法。静态源文件展示完整内容，GIF 依次展开三个说明层，不表示运行评测或模型生成。</desc>

  <!-- 两页手册是既有书本标识的延伸；背景固定，保证循环和透明边界稳定。 -->
  <rect width="1200" height="420" rx="24" fill="#f7f8fa"/>
  <g id="book-pages">
    <path d="M24 30 Q332 14 646 34 V384 Q332 370 24 390 Z" fill="#ffffff"/>
    <path d="M654 34 Q918 14 1176 30 V390 Q918 370 654 384 Z" fill="#ffffff"/>
    <path d="M650 42 V376" fill="none" stroke="#e2e5e9" stroke-width="2"/>
    <path d="M610 32 V85 L624 76 L638 85 V33" fill="#6957d4"/>
  </g>

  <!-- 复用 public/favicon.svg 的书本轮廓；主色取 tokens.css 的默认主题。 -->
  <g id="identity" transform="translate(56 52)">
    <rect width="44" height="44" rx="12" fill="#6957d4"/>
    <g transform="scale(1.1)">
      <path d="M10 12h7l3 3 3-3h7v17h-7l-3 3-3-3h-7z"
            fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M20 15v16M14 17h3M23 17h3M14 22h3M23 22h3"
            fill="none" stroke="#ffffff" stroke-width="2"/>
    </g>
    <text x="60" y="33" fill="#252932" font-size="31" font-weight="700">what's a benchmark?</text>
  </g>

  <!-- 项目定位始终可读；动画只负责说明条目内容的阅读次序。 -->
  <g id="project-introduction" fill="#252932">
    <text x="56" y="203" font-size="92" font-weight="800" letter-spacing="-3">到底测什么？</text>
    <text x="60" y="256" font-size="36" fill="#606773">看懂 AI 评测分数背后的</text>
    <text x="58" y="309" font-size="40" font-weight="700" fill="#6957d4">任务 · 样例 · 评分</text>
    <text x="60" y="361" font-size="20" fill="#606773">whiteplusms.github.io/whats-a-benchmark</text>
  </g>

  <!-- 以下是条目内容的示意排版，文字和例子均能回到仓库中的真实字段。 -->
  <g id="benchmark-record">
    <text x="704" y="82" fill="#252932" font-size="32" font-weight="700">HumanEval / 0</text>
    <text x="704" y="111" fill="#606773" font-size="20">真实题目节选</text>
    <path d="M704 183 H1136 M704 307 H1136" fill="none" stroke="#e2e5e9" stroke-width="2"/>

    <g id="task-detail">
      <text x="704" y="139" fill="#6957d4" font-size="20" font-weight="600">任务</text>
      <text x="704" y="170" fill="#252932" font-size="30" font-weight="600">补全一个 Python 函数</text>
    </g>

    <!-- 原始 prompt 第一条 doctest：has_close_elements([1.0, 2.0, 3.0], 0.5) 为 False。 -->
    <g id="sample-detail">
      <text x="704" y="215" fill="#6957d4" font-size="20" font-weight="600">判断两个数是否足够接近</text>
      <text x="704" y="254" fill="#252932" font-size="32"
            font-family="Consolas, Cascadia Code, ui-monospace, monospace">[1.0, 2.0, 3.0]</text>
      <text x="704" y="291" fill="#606773" font-size="26"
            font-family="Consolas, Cascadia Code, ui-monospace, monospace">threshold = 0.5<tspan fill="#6957d4" font-weight="700"> → False</tspan></text>
    </g>

    <g id="score-detail">
      <text x="704" y="349" fill="#606773" font-size="24">评分方法</text>
      <text x="864" y="352" fill="#6957d4" font-size="36" font-weight="700"
            font-family="Consolas, Cascadia Code, ui-monospace, monospace">pass@k</text>
    </g>
  </g>
</svg>
